volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  ibanking_network:
    name: ibanking-prod
    driver: bridge

services:
  postgres:
    image: postgres:18.6
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart:
      - unless-stopped
    networks:
      - ibanking_network
  
  nginx:
    image: nginx:stable-alpine
    container_name: nginx_ibanking
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../src/web:/app:ro
    restart:
    - unless-stopped
    networks:
      - ibanking_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"