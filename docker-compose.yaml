volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  ibanking_network:
    name: ibanking_local
    driver: bridge

services:
  postgres:
    image: postgres:18.6
    container_name: postgres_db
    environment: 
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${DB_PORT_HOST:-5433}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/infra/databases/scripts/init-multi-postgres-databases.sh:/docker-entrypoint-initdb.d/init-user-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ibanking_local
    restart: unless-stopped
  
  auth_service:
    build: 
      context: .
      dockerfile: ./src/services/auth_service/Dockerfile
    container_name: auth_service
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/auth_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ibanking_local
    restart: unless-stopped