volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  ibanking_network:
    name: ibanking_local
    driver: bridge

services:
  postgres:
    image: postgres:18.6
    container_name: postgres_db
    command: 
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ibanking_local
    restart:
      - unless-stopped