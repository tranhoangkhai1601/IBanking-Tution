<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iBanking - Home</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/dashboard.css">
  </head>

  <body class="dashboard-page">

    <div class="app-container">
      <header class="header-bar">
        <menu-toggle controls="dashboard-menu"></menu-toggle>
        <div class="header-identity">
          <auth-brand class="dashboard-brand" variant="compact">
            <span class="brand__name">iBanking</span>
          </auth-brand>
          <h1 class="header-title">Home</h1>
        </div>
        <div class="user-badge" id="user-display"></div>
        <div class="auth-buttons">
          <button id="btn-signin" class="primary-button btn-signin-nav"
            onclick="handleSignIn()">Sign in</button>
          <button id="btn-logout" class="btn-logout-nav"
            onclick="handleLogout()">Logout</button>
        </div>
      </header>

      <div class="main-body">
        <div id="dashboard-menu" class="sidebar-panel">
          <nav class="sidebar-menu" aria-label="Main navigation">
            <a href="./homepage.html" class="nav-item active"
              aria-current="page">Home</a>
            <a href="./transaction.html" class="nav-item auth-only">Pay
              tuition</a>
            <a href="./profile.html" class="nav-item auth-only">Profile</a>
          </nav>
        </div>

        <main class="content-area">
          <div class="dashboard-layout">
            <div class="home-content-grid">

              <div class="dashboard-card account-card">
                <div class="account-number-box">
                  <label>Account number:</label>
                  <div class="val" id="account-number">-</div>
                </div>
                <div class="account-balance-box">
                  <label>Balance:</label>
                  <div class="val" id="account-balance">0 VND</div>
                </div>
              </div>

              <div class="dashboard-card history-card">
                <h3 id="history-title">Transaction history</h3>
                <div id="history-container" role="region"
                  aria-labelledby="history-title" tabindex="0">
                </div>
              </div>

            </div>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="./js/components/auth-brand.js"></script>
    <script type="module" src="./js/components/menu-toggle.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/homepage.js"></script>
  </body>

</html>
