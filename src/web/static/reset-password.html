<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <script src="./i18n/i18n-boot.js"></script>

        <title>Reset Password</title>

        <link rel="stylesheet" href="./css/style.css">
        <link rel="stylesheet" href="./css/auth.css">

        <script type="module" src="./js/auth/reset-password.js"></script>
    </head>

    <body class="auth-page">
        <main class="app-shell">
            <auth-brand
                class="brand-panel"
                variant="panel">
            </auth-brand>

            <section
                class="auth-panel"
                aria-labelledby="reset-password-title">

                <auth-brand
                    class="mobile-header"
                    variant="compact">
                </auth-brand>

                <div class="auth-card">
                    <p
                        class="status-message status-message--error"
                        id="reset-page-error"
                        role="alert"
                        hidden></p>
                    <div id="reset-form-view">
                        <a class="back-link" href="./login.html">
                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                                focusable="false">
                                <path d="m15 18-6-6 6-6M9 12h10"></path>
                            </svg>

                            <span data-i18n="backToLogin">Back to Login</span>
                        </a>

                        <div class="screen-icon" aria-hidden="true">
                            <svg
                                width="26"
                                height="26"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                focusable="false">
                                <rect x="4" y="10" width="16" height="11"
                                    rx="2"></rect>
                                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                            </svg>
                        </div>

                        <h1
                            id="reset-password-title"
                            data-i18n="resetTitle">
                            Create New Password
                        </h1>

                        <p class="subtitle" data-i18n="resetDescription">
                            Enter and confirm your new password.
                        </p>

                        <form
                            id="reset-password-form"
                            method="post"
                            novalidate>

                            <div class="field">
                                <label
                                    for="new-password"
                                    data-i18n="newPasswordLabel">
                                    New password
                                </label>

                                <div class="field__control">
                                    <span class="field__icon"
                                        aria-hidden="true">
                                        <svg
                                            width="20"
                                            height="20"
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="1.8"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            focusable="false">
                                            <rect x="4" y="10" width="16"
                                                height="11" rx="2"></rect>
                                            <path
                                                d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                                        </svg>
                                    </span>

                                    <input
                                        id="new-password"
                                        name="new-password"
                                        type="password"
                                        autocomplete="new-password"
                                        placeholder="Enter your new password"
                                        data-i18n-placeholder="newPasswordPlaceholder"
                                        required
                                        aria-invalid="false"
                                        aria-describedby="new-password-error">

                                    <button
                                        class="field__action"
                                        type="button"
                                        data-password-toggle="new-password"
                                        aria-label="Show password"
                                        aria-controls="new-password"
                                        disabled>
                                        <svg
                                            width="20"
                                            height="20"
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="1.8"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            aria-hidden="true"
                                            focusable="false">
                                            <path
                                                d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                                            <circle cx="12" cy="12"
                                                r="2.5"></circle>
                                            <path data-password-slash
                                                d="m3 3 18 18"
                                                hidden></path>
                                        </svg>
                                    </button>
                                </div>

                                <p
                                    class="field__error"
                                    id="new-password-error"
                                    hidden>
                                </p>
                            </div>

                            <div class="field">
                                <label
                                    for="confirm-password"
                                    data-i18n="confirmPasswordLabel">
                                    Confirm new password
                                </label>

                                <div class="field__control">
                                    <span class="field__icon"
                                        aria-hidden="true">
                                        <svg
                                            width="20"
                                            height="20"
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="1.8"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            focusable="false">
                                            <rect x="4" y="10" width="16"
                                                height="11" rx="2"></rect>
                                            <path
                                                d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                                        </svg>
                                    </span>

                                    <input
                                        id="confirm-password"
                                        name="confirm-password"
                                        type="password"
                                        autocomplete="new-password"
                                        placeholder="Re-enter your new password"
                                        data-i18n-placeholder="confirmPasswordPlaceholder"
                                        required
                                        aria-invalid="false"
                                        aria-describedby="confirm-password-error">

                                    <button
                                        class="field__action"
                                        type="button"
                                        data-password-toggle="confirm-password"
                                        aria-label="Show password"
                                        aria-controls="confirm-password"
                                        disabled>
                                        <svg
                                            width="20"
                                            height="20"
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="1.8"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            aria-hidden="true"
                                            focusable="false">
                                            <path
                                                d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                                            <circle cx="12" cy="12"
                                                r="2.5"></circle>
                                            <path data-password-slash
                                                d="m3 3 18 18"
                                                hidden></path>
                                        </svg>
                                    </button>
                                </div>

                                <p
                                    class="field__error"
                                    id="confirm-password-error"
                                    hidden>
                                </p>
                            </div>

                            <p
                                class="status-message status-message--error"
                                id="reset-password-status"
                                role="alert"
                                aria-atomic="true"
                                hidden></p>

                            <button
                                class="primary-button"
                                id="reset-password-submit"
                                type="submit"
                                disabled>
                                <span data-i18n="resetAction">Reset
                                    Password</span>

                                <svg
                                    width="18"
                                    height="18"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                                    focusable="false">
                                    <path d="m9 18 6-6-6-6"></path>
                                </svg>
                            </button>

                            <noscript>
                                <p class="field__error">
                                    Please enable JavaScript to use this form.
                                </p>
                            </noscript>
                        </form>

                        <p class="security-note" data-i18n="loginSecurity">
                            Keep your password private.
                        </p>
                    </div>
                    <!-- Đóng #reset-form-view -->

                    <section
                        class="reset-success"
                        id="reset-success"
                        aria-labelledby="reset-success-title"
                        hidden>

                        <div
                            class="screen-icon screen-icon--success"
                            aria-hidden="true">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                focusable="false">
                                <path d="m5 12 4 4L19 6"></path>
                            </svg>
                        </div>

                        <h1
                            id="reset-success-title"
                            tabindex="-1"
                            data-i18n="resetSuccessTitle">
                            Password Reset Successful
                        </h1>

                        <p
                            class="subtitle"
                            data-i18n="resetSuccessDescription">
                            Your password has been updated. You can now log in
                            with your new password.
                        </p>

                        <a class="primary-button" href="./login.html">
                            <span data-i18n="backToLogin">Back to Login</span>

                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                                focusable="false">
                                <path d="m9 18 6-6-6-6"></path>
                            </svg>
                        </a>
                    </section>
                </div>
                <language-switch></language-switch>
            </section>
        </main>
    </body>
</html>
