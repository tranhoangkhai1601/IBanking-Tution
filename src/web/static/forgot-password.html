<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="./js/i18n-boot.js"></script>
        <title>Forgot Password</title>
        <link rel="stylesheet" href="./css/style.css">
        <link rel="stylesheet" href="./css/auth.css">
        <script type="module" src="./js/forgot-password.js"></script>
    </head>
    <body class="auth-page">
        <main class="app-shell">
            <auth-brand
                class="brand-panel"
                variant="panel">
            </auth-brand>

            <section class="auth-panel" aria-labelledby="forgot-password-title">
                <auth-brand
                    class="mobile-header"
                    variant="compact">
                </auth-brand>

                <div class="auth-card">
                    <a class="back-link" href="./login.html"><svg width="18"
                            height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true" focusable="false"><path
                                d="m15 18-6-6 6-6M9 12h10" /></svg><span data-i18n="backToLogin">Back to
                            Login</span></a>

                    <div class="screen-icon" aria-hidden="true"><svg width="20"
                            height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true" focusable="false"><rect x="4"
                                y="10" width="16" height="11" rx="2" /><path
                                d="M8 10V7a4 4 0 0 1 8 0v3" /></svg></div>
                    <h1 id="forgot-password-title" data-i18n="forgotTitle">Forgot Password?</h1>
                    <p class="subtitle" data-i18n="forgotDescription">No worries. Enter the email or phone
                        number linked to your account to continue.</p>

                    <form id="forgot-password-form" method="post" novalidate>
                        <div class="field">
                            <label for="identifier" data-i18n="identifierLabel">Email or phone
                                number</label>
                            <div class="field__control">
                                <span class="field__icon"
                                    aria-hidden="true"><svg width="20"
                                        height="20" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        aria-hidden="true"
                                        focusable="false"><rect x="3" y="5"
                                            width="18" height="14"
                                            rx="2" /><path
                                            d="m4 7 8 6 8-6" /></svg></span>
                                <input
                                    id="identifier"
                                    name="identifier"
                                    type="text"
                                    placeholder="Enter your email or phone number"
                                    data-i18n-placeholder="identifierPlaceholder"
                                    autocomplete="username"
                                    autocapitalize="none"
                                    spellcheck="false"
                                    required
                                    aria-invalid="false"
                                    aria-describedby="identifier-error">
                            </div>
                            <p class="field__error" id="identifier-error"
                                hidden></p>
                        </div>

                        <p class="status-message" id="forgot-password-status"
                            role="status" aria-live="polite"
                            aria-atomic="true"></p>

                        <button class="primary-button"
                            id="forgot-password-submit" type="submit" disabled>
                            <span data-i18n="continueAction">Continue</span><svg width="18" height="18"
                                viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8"
                                stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true" focusable="false"><path
                                    d="m9 18 6-6-6-6" /></svg>
                        </button>
                        <noscript><p class="field__error">Please enable
                                JavaScript to use this form.</p></noscript>
                    </form>

                    <p class="security-note"><svg width="20" height="20"
                            viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true" focusable="false"><path
                                d="M12 22s8-3.6 8-10V5l-8-3-8 3v7c0 6.4 8 10 8 10Z" /></svg><span data-i18n="forgotSecurity">Keep
                            your account information private.</span></p>
                </div>
                <language-switch></language-switch>
            </section>
        </main>
    </body>
</html>
