<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="./js/i18n-boot.js"></script>
        <title>OTP Verification</title>
        <link rel="stylesheet" href="./css/style.css">
        <link rel="stylesheet" href="./css/auth.css">
        <script type="module" src="./js/otp.js"></script>
    </head>
    <body class="auth-page">
        <main class="app-shell">
            <auth-brand
                class="brand-panel"
                variant="panel">
            </auth-brand>

            <section class="auth-panel" aria-labelledby="otp-title">
                <auth-brand
                    class="mobile-header"
                    variant="compact">
                </auth-brand>

                <div class="auth-card">
                    <a class="back-link" href="./forgot-password.html">
                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                            focusable="false">
                            <path d="m15 18-6-6 6-6M9 12h10" />
                        </svg>
                        <span data-i18n="editRecipient">Edit email or phone</span>
                    </a>

                    <div class="screen-icon screen-icon--code"
                        aria-hidden="true">
                        <span>•••</span>
                    </div>

                    <h1 id="otp-title" data-i18n="otpTitle">Verify Your Account</h1>

                    <p class="subtitle" id="otp-description">
                        Enter your verification code to continue.
                    </p>

                    <form id="otp-form" method="post" novalidate>
                        <fieldset class="otp-fieldset">
                            <legend class="otp-label" data-i18n="verificationCode">Verification code</legend>

                            <p class="otp-hint" id="otp-help"></p>

                            <div class="otp-grid" id="otp-inputs"></div>

                            <p class="field__error" id="otp-error" hidden></p>
                        </fieldset>

                        <div class="resend-row">
                            <div class="resend-info">
                                <span data-i18n="needCode">Need another code?</span>

                                <span
                                    id="otp-expiry"
                                    role="timer"
                                    aria-live="off"
                                    hidden>
                                    <span data-i18n="expiresIn">Code expires in</span>
                                    <strong id="otp-time"></strong>
                                </span> <!-- Sau này có thể hiển thị thời gian hết hạn OTP-->
                            </div>

                            <button class="text-link" id="resend-otp"
                                type="button" data-i18n="resendAction" disabled>
                                Resend OTP
                            </button>
                        </div>

                        <p
                            class="status-message"
                            id="otp-status"
                            role="status"
                            aria-live="polite"
                            aria-atomic="true"></p>

                        <button
                            class="primary-button"
                            id="otp-submit"
                            type="submit"
                            disabled>
                            <span data-i18n="verifyAction">Verify OTP</span>

                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                                focusable="false">
                                <path d="m9 18 6-6-6-6" />
                            </svg>
                        </button>

                        <noscript>
                            <p class="field__error">
                                Please enable JavaScript to use this form.
                            </p>
                        </noscript>
                    </form>

                    <p class="security-note" data-i18n="otpSecurity">
                        Never share your verification code.
                    </p>
                </div>
                <language-switch></language-switch>
            </section>
        </main>
    </body>
</html>
