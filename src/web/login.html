<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./i18n/i18n-boot.js"></script>
    <title>Login</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
    <script type="module" src="./js/auth/login.js"></script>
  </head>
  <body class="auth-page">
    <main class="app-shell">
      <auth-brand class="brand-panel" variant="panel"> </auth-brand>

      <section class="auth-panel" aria-labelledby="login-title">
        <auth-brand class="mobile-header" variant="compact"> </auth-brand>

        <div class="auth-card">
          <p class="eyebrow" data-i18n="welcomeBack">Welcome back</p>
          <h1 id="login-title" data-i18n="loginTitle">Login to your account</h1>
          <p class="subtitle" data-i18n="loginDescription">
            Enter your details to access your tuition services.
          </p>

          <form id="login-form" method="post" novalidate>
            <div class="field">
              <label for="identifier" data-i18n="identifierLabel"
                >Email or phone number</label
              >
              <div class="field__control">
                <span class="field__icon" aria-hidden="true"
                  ><svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <rect x="3" y="5" width="18" height="14" rx="2" />
                    <path d="m4 7 8 6 8-6" /></svg
                ></span>
                <input
                  class="input-field"
                  id="identifier"
                  name="identifier"
                  type="text"
                  placeholder="Enter your email or phone number"
                  data-i18n-placeholder="identifierPlaceholder"
                  autocomplete="username"
                  autocapitalize="none"
                  spellcheck="false"
                  required
                  aria-invalid="false"
                  aria-describedby="identifier-error"
                />
              </div>
              <p class="field__error" id="identifier-error" hidden></p>
            </div>

            <div class="field">
              <label for="password" data-i18n="passwordLabel">Password</label>
              <div class="field__control">
                <span class="field__icon" aria-hidden="true"
                  ><svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <rect x="4" y="10" width="16" height="11" rx="2" />
                    <path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg
                ></span>
                <input
                  class="input-field"
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Enter your password"
                  data-i18n-placeholder="passwordPlaceholder"
                  autocomplete="current-password"
                  required
                  aria-invalid="false"
                  aria-describedby="password-error"
                />
                <button
                  class="field__action"
                  id="password-toggle"
                  type="button"
                  disabled
                  aria-label="Show password"
                  aria-controls="password"
                >
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path
                      d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
                    />
                    <circle cx="12" cy="12" r="2.5" />
                    <path id="password-slash" d="m3 3 18 18" hidden />
                  </svg>
                </button>
              </div>
              <p class="field__error" id="password-error" hidden></p>
            </div>

            <a
              class="text-link forgot-link"
              href="./forgot-password"
              data-i18n="forgotLink"
              >Forgot Password</a
            >

            <p
              class="status-message"
              id="login-status"
              role="status"
              aria-live="polite"
              aria-atomic="true"
            ></p>

            <button
              class="primary-button"
              id="login-submit"
              type="submit"
              disabled
            >
              <span data-i18n="loginAction">Login</span
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="m9 18 6-6-6-6" />
              </svg>
            </button>
            <noscript
              ><p class="field__error">
                Please enable JavaScript to use this form.
              </p></noscript
            >
          </form>

          <p class="security-note">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="4" y="10" width="16" height="11" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg
            ><span data-i18n="loginSecurity">Keep your password private.</span>
          </p>
        </div>
        <language-switch></language-switch>
      </section>
    </main>
  </body>
</html>
